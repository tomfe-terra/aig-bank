AWSTemplateFormatVersion: '2010-09-09'
Description: 'AIG Bank Infrastructure - EC2, Security Groups, and Elastic IP (using default VPC)'

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair for SSH access
    
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID (use your default VPC)
    
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet ID (use a public subnet from your default VPC)
    
  YourIPAddress:
    Type: String
    Description: Your IP address in CIDR notation (e.g., 1.2.3.4/32) for SSH access
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IP CIDR range (e.g., 1.2.3.4/32)
    
  DomainName:
    Type: String
    Description: Base domain name (e.g., example.com or prod.example.com)
    
  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID (e.g., Z1234567890ABC)
    AllowedPattern: '^Z[A-Z0-9]+$'
    ConstraintDescription: Must be a valid Route53 Hosted Zone ID starting with Z
    
  InstanceType:
    Type: String
    Default: t3.medium
    Description: EC2 instance type
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge

Resources:
  # Security Group
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-ec2-sg'
      GroupDescription: Security group for AIG Bank EC2 instance
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # SSH access from your IP only
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref YourIPAddress
          Description: SSH access from your IP
        # HTTP access - initially open for Lets Encrypt (will be restricted after cert setup)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP - Temporary for Lets Encrypt
        # HTTPS access - initially open for Lets Encrypt (will be restricted after cert setup)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS - Temporary for Lets Encrypt
        # Terra EIP1
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 443
          CidrIp: 44.207.104.77/32
          Description: Terra EIP1 - HTTP/HTTPS
        # Terra EIP2
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 443
          CidrIp: 54.208.3.5/32
          Description: Terra EIP2 - HTTP/HTTPS
        # Terra EIP3
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 443
          CidrIp: 34.236.235.217/32
          Description: Terra EIP3 - HTTP/HTTPS
        # Terra TIP1
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 443
          CidrIp: 84.109.140.20/32
          Description: Terra TIP1 - HTTP/HTTPS
        # Terra TIP2
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 443
          CidrIp: 84.109.140.21/32
          Description: Terra TIP2 - HTTP/HTTPS
        # Terra TIP3
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 443
          CidrIp: 84.109.140.22/32
          Description: Terra TIP3 - HTTP/HTTPS
        # Terra TIP4
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 443
          CidrIp: 84.109.140.23/32
          Description: Terra TIP4 - HTTP/HTTPS
        # Your IP for HTTP/HTTPS
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 443
          CidrIp: !Ref YourIPAddress
          Description: Your IP - HTTP/HTTPS
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-sg'
        - Key: Project
          Value: AIG-Bank

  # EC2 Instance
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref EC2SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          
          # Update system
          yum update -y
          
          # Install basic tools
          yum install -y git curl wget htop
          
          # Create app directory
          mkdir -p /opt/aig-bank
          chown ec2-user:ec2-user /opt/aig-bank
          
          # Store domain name for later use
          echo "${DomainName}" > /opt/aig-bank/.domain
          
          # Signal successful completion
          echo "User data script completed" > /var/log/userdata-complete.log
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2'
        - Key: Project
          Value: AIG-Bank
        - Key: Domain
          Value: !Ref DomainName

  # Route53 DNS Records
  AppDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'app.${DomainName}'
      Type: A
      TTL: 300
      ResourceRecords:
        - !GetAtt EC2Instance.PublicIp

  ApiDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'api.${DomainName}'
      Type: A
      TTL: 300
      ResourceRecords:
        - !GetAtt EC2Instance.PublicIp

  PayDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'pay.${DomainName}'
      Type: A
      TTL: 300
      ResourceRecords:
        - !GetAtt EC2Instance.PublicIp

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VpcId
    Export:
      Name: !Sub '${AWS::StackName}-VPC-ID'

  SubnetId:
    Description: Subnet ID
    Value: !Ref SubnetId
    Export:
      Name: !Sub '${AWS::StackName}-Subnet-ID'

  EC2InstanceId:
    Description: EC2 Instance ID
    Value: !Ref EC2Instance
    Export:
      Name: !Sub '${AWS::StackName}-EC2-ID'

  EC2PublicIP:
    Description: EC2 Instance Public IP Address
    Value: !GetAtt EC2Instance.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-PublicIP'

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref EC2SecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroup-ID'

  EC2PublicDNS:
    Description: EC2 Instance Public DNS Name
    Value: !GetAtt EC2Instance.PublicDnsName

  SSHCommand:
    Description: SSH command to connect to the instance
    Value: !Sub 'ssh -i ~/.ssh/${KeyPairName}.pem ec2-user@${EC2Instance.PublicIp}'

  WebURLs:
    Description: Application URLs
    Value: !Sub |
      App: https://app.${DomainName}
      API: https://api.${DomainName}/docs
      Pay: https://pay.${DomainName}

  DNSRecords:
    Description: DNS Records Created
    Value: !Sub |
      app.${DomainName} → ${EC2Instance.PublicIp}
      api.${DomainName} → ${EC2Instance.PublicIp}
      pay.${DomainName} → ${EC2Instance.PublicIp}

