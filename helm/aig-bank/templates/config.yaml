apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aig-bank.secretName" . }}
  labels:
    {{- include "aig-bank.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  DATABASE_URL: {{ include "aig-bank.databaseUrl" . | quote }}
  PGWEB_DATABASE_URL: {{ include "aig-bank.pgwebDatabaseUrl" . | quote }}
  JWT_SECRET_KEY: {{ .Values.api.env.jwtSecretKey | quote }}
  AES_KEY: {{ .Values.api.env.aesKey | quote }}
  HMAC_KEY: {{ .Values.api.env.hmacKey | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aig-bank.configMapName" . }}
  labels:
    {{- include "aig-bank.labels" . | nindent 4 }}
data:
  DOMAIN: {{ .Values.domain | quote }}
  API_DEBUG: {{ .Values.api.env.debug | quote }}
  API_LOG_LEVEL: {{ .Values.api.env.logLevel | quote }}
  API_CORS_ORIGINS: {{ include "aig-bank.apiCorsOriginsJson" . | quote }}
  PAY_API_ENDPOINT: {{ include "aig-bank.payApiEndpoint" . | quote }}
  PAY_PORT: {{ .Values.pay.service.port | quote }}
